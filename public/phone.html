<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#05080f" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>Tinderbox</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet" />
<style>
  :root { --bg:#05080f; --ice:#e9fbff; --cyan:#4fd0e0; --soft:#7fd3dd; --dim:#2e6f7b; }
  * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; overflow:hidden; background:var(--bg); }
  body { color:var(--ice); font-family:"Cormorant Garamond", Georgia, serif; user-select:none;
         -webkit-user-select:none; touch-action:none; overscroll-behavior:none; }

  .frame { position:fixed; inset:max(14px, env(safe-area-inset-top)) 14px max(14px, env(safe-area-inset-bottom));
           border:1px solid var(--dim); border-radius:14px; pointer-events:none; }
  .frame::after { content:""; position:absolute; inset:6px; border:1px solid rgba(46,111,123,0.45); border-radius:10px; }

  #eyeWrap { position:fixed; left:50%; top:12vh; transform:translateX(-50%); width:min(66vw, 46vh, 340px); aspect-ratio:1; }
  #eye { width:100%; height:100%; display:block; }

  .stage { position:fixed; left:0; right:0; top:calc(12vh + min(66vw, 46vh, 340px) + 3vh); bottom:0;
           display:flex; flex-direction:column; align-items:center; text-align:center; padding:0 32px; gap:14px;
           transition:opacity .6s ease; }
  .hidden { display:none !important; }
  .kicker { font-style:italic; font-size:clamp(18px, 5vw, 24px); color:var(--soft); }
  .head { font-weight:600; font-size:clamp(30px, 9vw, 46px); line-height:1.08; letter-spacing:0.02em; }
  .title { font-weight:600; font-size:clamp(34px, 11vw, 54px); letter-spacing:0.22em; text-transform:uppercase; }
  .sub { font-style:italic; font-size:clamp(18px, 5vw, 23px); color:var(--soft); }
  #s-done { gap:8px; }
  #doneHead { font-size:clamp(30px, 9vw, 52px); letter-spacing:0.12em; overflow-wrap:anywhere; max-width:100%; }
  .rule { width:120px; height:1px; background:var(--dim); position:relative; margin:4px 0; }
  .rule::after { content:""; position:absolute; left:50%; top:50%; width:7px; height:7px; background:var(--cyan);
                 transform:translate(-50%,-50%) rotate(45deg); }
  .btn { margin-top:10px; background:none; color:var(--ice); border:1px solid var(--cyan); border-radius:999px;
         font:600 18px/1 "Cormorant Garamond", Georgia, serif; letter-spacing:0.32em; padding:16px 40px 16px 46px;
         cursor:pointer; box-shadow:0 0 22px rgba(79,208,224,0.18); }
  .btn:active { background:rgba(79,208,224,0.12); }
  .steps { display:flex; gap:10px; margin-top:6px; }
  .steps i { width:7px; height:7px; border:1px solid var(--cyan); transform:rotate(45deg); }
  .steps i.on { background:var(--cyan); }
  .bar { width:min(70vw, 280px); height:2px; background:rgba(46,111,123,0.5); overflow:hidden; margin-top:8px; }
  .bar > div { height:100%; width:0; background:var(--cyan); box-shadow:0 0 10px var(--cyan); transition:width .25s linear; }

  /* invisible 2 x 3 operator grid, same layout as the leaves: 1 2 / 3 4 / 5 6 */
  #pad { position:fixed; inset:0; z-index:20; display:grid; grid-template-columns:1fr 1fr; grid-template-rows:1fr 1fr 1fr; }
  #pad.locked { pointer-events:none; }
  #pad .z { position:relative; }
  body.rehearse #pad .z { outline:1px dashed rgba(79,208,224,0.35); outline-offset:-1px; }
  body.rehearse #pad .z::after { content:attr(data-z); position:absolute; inset:0; display:grid; place-items:center;
         font:600 40px "Cormorant Garamond", serif; color:rgba(79,208,224,0.35); }

  /* operator-only signal dot: cyan = tap taken, red = sound computer not reachable */
  #dot { position:fixed; bottom:max(7px, env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:40;
         width:5px; height:5px; border-radius:50%; background:transparent; pointer-events:none; transition:background .12s; }
  #dot.tap { background:rgba(79,208,224,0.7); }
  #dot.bad { background:rgba(255,80,80,0.55); }

  #hudBtn { position:fixed; right:max(18px, env(safe-area-inset-right)); bottom:max(18px, env(safe-area-inset-bottom));
            z-index:60; width:26px; height:26px; border-radius:50%; border:1px solid rgba(79,208,224,0.25);
            background:transparent; opacity:0.18; }
  #hud { position:fixed; left:18px; bottom:18px; z-index:50; font:12px/1.5 ui-monospace, Menlo, monospace;
         background:rgba(5,8,15,0.92); border:1px solid var(--dim); border-radius:8px; padding:10px 12px; min-width:190px; display:none; }
  body.rehearse #hud { display:block; }
  #hud b { color:var(--cyan); font-weight:600; }
  #hud button { margin-top:6px; font:12px ui-monospace, monospace; color:var(--ice); background:none;
                border:1px solid var(--dim); border-radius:6px; padding:4px 8px; }
</style>
</head>
<body>
  <div class="frame"></div>
  <div id="eyeWrap"><canvas id="eye"></canvas></div>

  <section class="stage" id="s-intro">
    <div class="title">Tinderbox</div>
    <div class="rule"></div>
    <div class="sub" id="introSub">Hold your word in mind.</div>
    <button class="btn" id="btnBegin">BEGIN</button>
  </section>

  <section class="stage hidden" id="s-question">
    <div class="kicker" id="qKicker">The first question</div>
    <div class="head" id="qHead"></div>
    <div class="sub" id="qSub"></div>
    <div class="steps"><i id="st1"></i><i id="st2"></i></div>
  </section>

  <section class="stage hidden" id="s-listening">
    <div class="kicker">Listening</div>
    <div class="head" id="procHead">Finding your word…</div>
    <div class="bar"><div id="procFill"></div></div>
  </section>

  <section class="stage hidden" id="s-ready">
    <div class="kicker">Now</div>
    <div class="head" id="readyHead">Close your eyes,<br>and listen.</div>
  </section>

  <section class="stage hidden" id="s-done" role="status" aria-live="polite" aria-atomic="true">
    <div class="kicker" id="doneKicker"></div>
    <div class="head" id="doneHead"></div>
    <div class="sub" id="doneSub"></div>
  </section>

  <div id="pad" class="locked">
    <div class="z" data-z="1"></div><div class="z" data-z="2"></div>
    <div class="z" data-z="3"></div><div class="z" data-z="4"></div>
    <div class="z" data-z="5"></div><div class="z" data-z="6"></div>
  </div>
  <div id="dot"></div>

  <button id="hudBtn" aria-label="rehearse"></button>
  <div id="hud">
    <div>link <b id="hLink">…</b></div>
    <div>stage <b id="hStage">intro</b></div>
    <div>taps <b id="hTaps">– · –</b></div>
    <div>card <b id="hCard">–</b></div>
    <button id="hAgain">again</button>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="/cards.js"></script>
<script src="/eye.js"></script>
<script>
'use strict';
/* =========================================================================
   TINDERBOX · phone (performer's secret input)

   Read the card back: upper-left sprig = first number, upper-right = second.
   The screen is an invisible 2 x 3 grid, laid out exactly like the leaves:
        1 | 2
        3 | 4
        5 | 6
   QUESTION 1  tap the first number   (re-tap to change; settles after a pause)
   QUESTION 2  tap the second number  (same)
   LISTENING   the sound computer is told which card to get ready
   READY       tap anywhere = the final secret button: the sound plays

   Operator signals: tiny dot at the bottom edge flashes cyan when a tap is taken,
   glows red when the sound computer is not connected. Phones that vibrate also buzz.
   Two-finger tap anywhere = start over.   Faint button bottom-right (or key r) = rehearse view.
   ========================================================================= */

// ---- words on screen: edit freely ----
const QUESTIONS = [
  { kicker: "The first question", head: "What colour<br>is your word?", sub: "Say it out loud." },
  { kicker: "The second question", head: "Is it warm,<br>or cold?",      sub: "Take your time." },
];
const LISTEN_MS = 3200;          // length of the "Finding your word…" bar
const SETTLE_MS = 900;           // pause after the last tap before a question is taken
const SHOW_WORD_AFTER = true;    // reveal the printed poem once the sound computer accepts the final tap

// ---- setup ----
const params = new URLSearchParams(location.search);
const ROOM = params.get("room") || "tinderbox";
const $ = (id) => document.getElementById(id);
const stages = ["intro", "question", "listening", "ready", "done"].reduce((o, k) => (o[k] = $("s-" + k), o), {});
const pad = $("pad"), dot = $("dot");
const eye = makeEye($("eye"), { seed: 1777 });

let stage = "intro", q = 0, taps = [null, null], settle = null, fired = false;
let linkOk = false, speakers = 0;
let runId = 0, listenTimer = null, revealTimer = null;

function clearReveal() {
  clearTimeout(settle);
  clearInterval(listenTimer);
  clearInterval(revealTimer);
  $("doneKicker").textContent = "";
  $("doneHead").textContent = "";
  $("doneSub").textContent = "";
}

function show(name) {
  stage = name;
  Object.values(stages).forEach((s) => s.classList.add("hidden"));
  stages[name].classList.remove("hidden");
  pad.classList.toggle("locked", !(name === "question" || name === "ready"));
  hud();
}

// ---- connection ----
const socket = io({ transports: ["websocket", "polling"], reconnection: true, reconnectionDelay: 500 });
socket.on("connect", () => { socket.emit("join", { room: ROOM, role: "phone" }); });
socket.on("disconnect", () => { linkOk = false; signal(); hud(); });
socket.on("joined", (s) => { linkOk = true; speakers = s.speakers; signal(); hud(); });
socket.on("room-state", (s) => { speakers = s.speakers; signal(); hud(); });

function signal() {                         // persistent red dot = trouble
  dot.classList.toggle("bad", !linkOk || speakers === 0);
}
function flash() {
  dot.classList.add("tap");
  setTimeout(() => dot.classList.remove("tap"), 110);
  if (navigator.vibrate) navigator.vibrate(8);
}
function warn() {
  dot.classList.add("bad");
  if (navigator.vibrate) navigator.vibrate([30, 60, 30]);
}

// ---- flow ----
function begin() {
  runId++;
  clearReveal();
  taps = [null, null]; fired = false; q = 0;
  askQuestion(0);
  keepAwake();
}
function askQuestion(i) {
  q = i;
  const Q = QUESTIONS[i];
  $("qKicker").textContent = Q.kicker; $("qHead").innerHTML = Q.head; $("qSub").textContent = Q.sub;
  $("st1").classList.toggle("on", i >= 0); $("st2").classList.toggle("on", i >= 1);
  show("question");
}
function onZone(z) {
  if (stage === "question") {
    taps[q] = z; flash(); hud();
    clearTimeout(settle);
    settle = setTimeout(() => (q === 0 ? askQuestion(1) : listen()), SETTLE_MS);
  } else if (stage === "ready") {
    fire();
  }
}
function listen() {
  const run = runId;
  show("listening");
  const [a, b] = taps;
  socket.timeout(4000).emit("select", { a, b }, (err, res) => {
    if (run !== runId) return;
    if (err || !res || !res.ok || !res.speakers) warn();
  });
  const fill = $("procFill"); fill.style.width = "0%";
  const t0 = performance.now();
  listenTimer = setInterval(() => {
    const p = Math.min(1, (performance.now() - t0) / LISTEN_MS);
    fill.style.width = (p * 100).toFixed(1) + "%";
    eye.setOpen(p);
    if (p >= 1) { clearInterval(listenTimer); show("ready"); }
  }, 60);
}
function fire() {
  if (fired) return;
  const run = runId;
  fired = true; flash();
  const [a, b] = taps;
  socket.timeout(3000).emit("fire", { a, b }, (err, res) => {
    if (run !== runId) return;
    if (err || !res || !res.ok) { fired = false; warn(); return; }   // not delivered: tap again
    afterFire();
  });
}
function afterFire() {
  const card = cardFromTaps(taps[0], taps[1]);
  $("doneKicker").textContent = SHOW_WORD_AFTER ? card.above : "";
  $("doneHead").textContent = SHOW_WORD_AFTER ? card.word.toUpperCase() : "";
  $("doneSub").textContent = SHOW_WORD_AFTER ? card.below : "";
  show("done");
  eye.setOpen(0);
  let k = 0;
  revealTimer = setInterval(() => { k++; eye.setLevel(0.5 + 0.5 * Math.sin(k / 5)); if (k > 90) { clearInterval(revealTimer); eye.setLevel(0); } }, 50);
}
function restart() {
  runId++;
  clearReveal();
  taps = [null, null]; fired = false;
  socket.emit("cancel");
  eye.setOpen(0.5); eye.setLevel(0);
  show("intro");
}

// ---- touch ----
function zoneAt(target) { const el = target.closest && target.closest(".z"); return el ? Number(el.dataset.z) : null; }
document.addEventListener("touchstart", (e) => {
  if (e.touches.length >= 2) { e.preventDefault(); restart(); }
}, { passive: false });
pad.addEventListener("touchstart", (e) => {
  e.preventDefault();
  if (e.touches.length >= 2) return;
  const z = zoneAt(e.target); if (z) onZone(z);
}, { passive: false });
pad.addEventListener("mousedown", (e) => { const z = zoneAt(e.target); if (z) onZone(z); });
$("btnBegin").addEventListener("click", begin);

// ---- rehearse view ----
function hud() {
  $("hLink").textContent = !linkOk ? "offline" : speakers ? `ok · ${speakers} speaker` : "no sound computer";
  $("hStage").textContent = stage;
  $("hTaps").textContent = `${taps[0] ?? "–"} · ${taps[1] ?? "–"}`;
  const c = taps[0] && taps[1] ? cardFromTaps(taps[0], taps[1]) : null;
  $("hCard").textContent = c ? `${c.n} ${c.word.toUpperCase()}` : "–";
}
$("hudBtn").addEventListener("click", () => document.body.classList.toggle("rehearse"));
$("hAgain").addEventListener("click", restart);
document.addEventListener("keydown", (e) => {
  if (e.key === "r") document.body.classList.toggle("rehearse");
  else if (e.key === "x") restart();
  else if (e.key === "Enter" && stage === "intro") begin();
  else if (/^[1-6]$/.test(e.key)) onZone(Number(e.key));          // desktop rehearsal
  else if (e.key === " " && stage === "ready") fire();
});

// keep the phone screen awake during the trick
let wakeLock = null;
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => (wakeLock = null)); } } catch {}
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && stage !== "intro") keepAwake(); });

show("intro");
</script>
</body>
</html>
